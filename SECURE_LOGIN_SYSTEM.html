<!DOCTYPE html>
<html lang="en">
<head>

    <style>

<body>

    <!-- Top System Bar -->
    <header class="system-topbar">
        <div style="display: flex; align-items: center; gap: 14px;">
            <span class="system-badge">
                <span class="pulse-dot"></span> Offline Desktop Web Edition
            </span>
            <span>University Security & Authentication Project</span>
        </div>
        <div class="system-actions">
            <button class="btn-topbar" onclick="openInspector('pillars')">&#128218; Security Pillars</button>
            <button class="btn-topbar" onclick="openInspector('db')">&#128450; View Database</button>
            <button class="btn-topbar" onclick="openInspector('crypto')">&#128272; Salt & Pepper Live</button>
            <button class="btn-topbar" onclick="resetDatabase()">&#8634; Reset Demo DB</button>
        </div>
    </header>

    <!-- App Views Container -->
    <div id="app" class="view-wrapper">
        <!-- Rendered dynamically by JavaScript -->
    </div>

    <!-- Interactive Security & Database Inspector Modal -->
    <div id="inspectorModal" class="modal-overlay" onclick="closeInspectorOnBackdrop(event)">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Security Project Inspector</h3>
                <button class="btn-topbar" onclick="closeInspector()">&#10005; Close</button>
            </div>
            
            <div class="modal-tabs">
                <button id="tab-pillars" class="tab-btn" onclick="switchTab('pillars')">4 Security Pillars</button>
                <button id="tab-db" class="tab-btn" onclick="switchTab('db')">Simulated MySQL Database</button>
                <button id="tab-crypto" class="tab-btn" onclick="switchTab('crypto')">Salt + Pepper Visualizer</button>
            </div>

            <div class="modal-content" id="modalBody">
                <!-- Injected based on active tab -->
            </div>
        </div>
    </div>

    <script>
        /**
         * SECURE LOGIN SYSTEM (DESKTOP WEB ENGINE)
         * Demonstrates the 4 Required Security Pillars:
         * 1. User Identification (Unique Username/Email)
         * 2. Two-Factor Authentication (OTP with 5-minute expiry & invalidation)
         * 3. Role-Based Access Control (RBAC: Admin vs Normal User & 403 Forbidden)
         * 4. Password Security (Salt + Server Pepper via Web Crypto API)
         */

        const DB_STORAGE_KEY = 'univ_sec_login_db_puit24110007';
        const SESSION_STORAGE_KEY = 'univ_sec_active_session';
        const SERVER_PEPPER = 'K9#F2!xP9$qL4@vB8*eT1^zW5&uM3#yR_UnivSecDemoKey_2024';
        const OTP_EXPIRY_SECONDS = 300; // 5 minutes

        // -------------------------------------------------------------
        // Cryptographic Utilities (Web Crypto API)
        // -------------------------------------------------------------
        
        // 128-bit random salt (32 hex characters)
        function generateSalt() {
            const bytes = new Uint8Array(16);
            window.crypto.getRandomValues(bytes);
            return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
        }

        // 6-digit random OTP
        function generateOTP() {
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            return (array[0] % 1000000).toString().padStart(6, '0');
        }

        // Salt + Pepper Hashing Pipeline
        async function hashPasswordWithSaltAndPepper(plainPassword, salt) {
            const encoder = new TextEncoder();
            
            // Step 1 & 2: Keyed HMAC-SHA256 of (Password + Salt) with Server PEPPER
            const key = await window.crypto.subtle.importKey(
                "raw",
                encoder.encode(SERVER_PEPPER),
                { name: "HMAC", hash: "SHA-256" },
                false,
                ["sign"]
            );
            const signature = await window.crypto.subtle.sign(
                "HMAC",
                key,
                encoder.encode(plainPassword + salt)
            );
            const hmacHex = Array.from(new Uint8Array(signature), b => b.toString(16).padStart(2, '0')).join('');

            // Step 3: Standard SHA-256 digest simulating bcrypt output storage
            const digest = await window.crypto.subtle.digest("SHA-256", encoder.encode(hmacHex));
            const finalHash = "$bcrypt_sim$" + Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, '0')).join('');

            return { hmacHex, finalHash };
        }

        async function verifyPassword(plainPassword, salt, storedHash) {
            const { finalHash } = await hashPasswordWithSaltAndPepper(plainPassword, salt);
            return finalHash === storedHash;
        }

        // -------------------------------------------------------------
        // Database & State Management (Simulating MySQL `users` table)
        // -------------------------------------------------------------
        
        async function getDatabase() {
            const raw = localStorage.getItem(DB_STORAGE_KEY);
            if (raw) {
                try { return JSON.parse(raw); } catch (e) {}
            }
            return await seedDefaultDatabase();
        }

        function saveDatabase(db) {
            localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(db));
        }

        async function seedDefaultDatabase() {
            const adminSalt = generateSalt();
            const studentSalt = generateSalt();

            const adminHashObj = await hashPasswordWithSaltAndPepper('Admin@1234', adminSalt);
            const studentHashObj = await hashPasswordWithSaltAndPepper('Student@1234', studentSalt);

            const initialDB = {
                users: [
                    {
                        id: 1,
                        username: 'admin',
                        email: 'admin@system.local',
                        password_hash: adminHashObj.finalHash,
                        salt: adminSalt,
                        role: 'admin',
                        otp: null,
                        otp_expiry: null,
                        created_at: new Date(Date.now() - 3600000).toLocaleString()
                    },
                    {
                        id: 2,
                        username: 'student',
                        email: 'student@university.edu',
                        password_hash: studentHashObj.finalHash,
                        salt: studentSalt,
                        role: 'user',
                        otp: null,
                        otp_expiry: null,
                        created_at: new Date().toLocaleString()
                    }
                ]
            };
            saveDatabase(initialDB);
            return initialDB;
        }

        async function resetDatabase() {
            if (confirm("Reset the simulated database back to initial demo state? All registered accounts will be reset.")) {
                await seedDefaultDatabase();
                clearSession();
                renderView('login', { alert: { type: 'success', msg: 'Database reset to default seed accounts.' } });
            }
        }

        // -------------------------------------------------------------
        // Session Management
        // -------------------------------------------------------------
        
        function getSession() {
            const raw = sessionStorage.getItem(SESSION_STORAGE_KEY);
            return raw ? JSON.parse(raw) : null;
        }

        function setSession(sessionObj) {
            sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(sessionObj));
        }

        function clearSession() {
            sessionStorage.removeItem(SESSION_STORAGE_KEY);
        }

        // -------------------------------------------------------------
        // Routing & Views Controller
        // -------------------------------------------------------------

        let currentView = 'login';
        let viewParams = {};
        let otpCountdownTimer = null;

        function navigateTo(view, params = {}) {
            currentView = view;
            viewParams = params;
            if (otpCountdownTimer) {
                clearInterval(otpCountdownTimer);
                otpCountdownTimer = null;
            }
            render();
        }

        function render() {
            const app = document.getElementById('app');
            const session = getSession();

            // RBAC Route Protection Guard
            if (currentView === 'admin_dashboard') {
                if (!session || !session.logged_in) {
                    navigateTo('login', { alert: { type: 'danger', msg: 'Please log in to access the portal.' } });
                    return;
                }
                if (session.role !== 'admin') {
                    // RBAC Guard intercepting unauthorized access!
                    navigateTo('access_denied', { attempted: 'admin_dashboard.php' });
                    return;
                }
            }

            if (currentView === 'user_dashboard') {
                if (!session || !session.logged_in) {
                    navigateTo('login', { alert: { type: 'danger', msg: 'Please log in to access your dashboard.' } });
                    return;
                }
            }

            if (currentView === 'verify_otp') {
                if (!session || !session.two_factor_pending) {
                    navigateTo('login');
                    return;
                }
            }

            // View Dispatcher
            switch (currentView) {
                case 'login':
                    app.innerHTML = renderLoginView();
                    break;
                case 'register':
                    app.innerHTML = renderRegisterView();
                    break;
                case 'verify_otp':
                    app.innerHTML = renderVerifyOTPView();
                    initOTPTimer();
                    break;
                case 'admin_dashboard':
                    renderAdminDashboardView().then(html => { app.innerHTML = html; });
                    break;
                case 'user_dashboard':
                    app.innerHTML = renderUserDashboardView();
                    break;
                case 'access_denied':
                    app.innerHTML = renderAccessDeniedView();
                    break;
                default:
                    app.innerHTML = renderLoginView();

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.textContent = "Verifying Credentials...";

            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value;

            const db = await getDatabase();
            const user = db.users.find(u => 
                u.username.toLowerCase() === identifier.toLowerCase() || 
                u.email.toLowerCase() === identifier.toLowerCase()
            );

            if (!user) {
                // Anti-enumeration generic error
                navigateTo('login', { alert: { type: 'danger', msg: 'Invalid credentials. Please verify your username/email and password.' } });
                return;
            }

            // Verify password using Salt + Pepper
            const isValid = await verifyPassword(password, user.salt, user.password_hash);
            if (!isValid) {
                navigateTo('login', { alert: { type: 'danger', msg: 'Invalid credentials. Please verify your username/email and password.' } });
                return;
            }

            // Password Factor Passed! Generate 2FA OTP
            const otp = generateOTP();
            const now = Date.now();
            const expiryTimestamp = now + (OTP_EXPIRY_SECONDS * 1000);

            // Update user's OTP record in database
            user.otp = otp;
            user.otp_expiry = expiryTimestamp;
            saveDatabase(db);

            // Store temporary 2FA pending session
            setSession({
                two_factor_pending: true,
                user_id: user.id,
                username: user.username,
                role: user.role,
                demo_otp: otp,
                expiry: expiryTimestamp
            });

            navigateTo('verify_otp');
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('btnReg');
            btn.disabled = true;
            btn.textContent = "Hashing with Salt + Pepper...";

            const username = document.getElementById('reg_username').value.trim();
            const email = document.getElementById('reg_email').value.trim();
            const password = document.getElementById('reg_password').value;
            const role = document.getElementById('reg_role').value;

            const db = await getDatabase();

            // Uniqueness checks
            if (db.users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                navigateTo('register', { alert: { type: 'danger', msg: `Username '${username}' is already taken.` } });
                return;
            }
            if (db.users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
                navigateTo('register', { alert: { type: 'danger', msg: `Email '${email}' is already registered.` } });
                return;
            }

            // Cryptographic Salt Generation + Pepper Hashing
            const salt = generateSalt();
            const { finalHash } = await hashPasswordWithSaltAndPepper(password, salt);

            const newUser = {
                id: db.users.length ? Math.max(...db.users.map(u => u.id)) + 1 : 1,
                username,
                email,
                password_hash: finalHash,
                salt,
                role,
                otp: null,
                otp_expiry: null,
                created_at: new Date().toLocaleString()
            };

            db.users.push(newUser);
            saveDatabase(db);

            navigateTo('login', { alert: { type: 'success', msg: `Account '${username}' created! You can now log in.` } });
        }

        function initOTPTimer() {
            const session = getSession();
            if (!session || !session.expiry) return;

            function update() {
                const now = Date.now();
                const diff = Math.max(0, Math.floor((session.expiry - now) / 1000));
                const el = document.getElementById('otpTimerDisplay');
                if (!el) return;

                if (diff <= 0) {
                    el.textContent = "EXPIRED! Please request a new OTP.";
                    el.style.color = "#ef4444";
                    clearInterval(otpCountdownTimer);
                } else {
                    const mins = String(Math.floor(diff / 60)).padStart(2, '0');
                    const secs = String(diff % 60).padStart(2, '0');
                    el.textContent = `Expires in: ${mins}:${secs}`;
                }
            }

            update();
            otpCountdownTimer = setInterval(update, 1000);
        }

        async function requestNewOTP() {
            const session = getSession();
            if (!session) return;

            const db = await getDatabase();
            const user = db.users.find(u => u.id === session.user_id);
            if (!user) return;

            const newOTP = generateOTP();
            const expiry = Date.now() + (OTP_EXPIRY_SECONDS * 1000);

            user.otp = newOTP;
            user.otp_expiry = expiry;
            saveDatabase(db);

            session.demo_otp = newOTP;
            session.expiry = expiry;
            setSession(session);

            navigateTo('verify_otp', { alert: { type: 'info', msg: 'A new 6-digit OTP code has been generated.' } });
        }

        async function handleVerifyOTPSubmit(e) {
            e.preventDefault();
            const session = getSession();
            const entered = document.getElementById('otpInput').value.trim();

            const db = await getDatabase();
            const user = db.users.find(u => u.id === session.user_id);

            if (!user || !user.otp) {
                navigateTo('verify_otp', { alert: { type: 'danger', msg: 'No active OTP found. Please request a new code.' } });
                return;
            }

            // Expiry check
            if (Date.now() > user.otp_expiry) {
                user.otp = null;
                saveDatabase(db);
                navigateTo('verify_otp', { alert: { type: 'danger', msg: 'OTP has expired. Please request a new one.' } });
                return;
            }

            // Timing-attack resistant verification simulation
            if (entered !== user.otp) {
                navigateTo('verify_otp', { alert: { type: 'danger', msg: 'Incorrect OTP code. Verification failed.' } });
                return;
            }

            // OTP Valid! Invalidate OTP immediately (Single-Use Enforcement)
            user.otp = null;
            user.otp_expiry = null;
            saveDatabase(db);

            // Establish Full Authenticated Session
            setSession({
                logged_in: true,
                user_id: user.id,
                username: user.username,
                email: user.email,
                role: user.role
            });

            // RBAC Redirection
            if (user.role === 'admin') {
                navigateTo('admin_dashboard');
            } else {
                navigateTo('user_dashboard');
            }
        }

                            <strong style="color:#5b21b6;">4. Password Security (Salt + Pepper)</strong>
                            <p style="font-size:0.85rem; color:#475569; margin-top:4px;">
                                Each account receives a unique 128-bit random salt stored in DB. A server-side pepper key is kept secret outside the database. Passwords are keyed via HMAC-SHA256 and stored as non-reversible digests.
                            </p>
                        </div>
                    </div>
                `;
            } else if (tab === 'db') {
                getDatabase().then(db => {
                    const rows = db.users.map(u => `
                        <tr>
                            <td><code>#${u.id}</code></td>
                            <td><strong>${escapeHtml(u.username)}</strong></td>
                            <td>${escapeHtml(u.email)}</td>
                            <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role}</span></td>
                            <td style="font-family:monospace; font-size:0.75rem;">${u.salt.substring(0, 12)}...</td>
                            <td style="font-family:monospace; font-size:0.75rem;">${u.password_hash.substring(0, 16)}...</td>
                            <td><code>${u.otp || 'NULL'}</code></td>
                        </tr>
                    `).join('');

                    body.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                            <h4 style="color:#1e293b;">Simulated MySQL <code>users</code> Table</h4>
                            <button class="btn btn-secondary btn-sm" onclick="resetDatabase()">Reset to Defaults</button>
                        </div>
                        <p style="color:#64748b; font-size:0.85rem; margin-bottom:12px;">
                            Notice that only salts and hashes are stored—never plain passwords.
                        </p>
                        <div class="table-responsive">
                            <table class="data-table" style="font-size:0.82rem;">
                                <thead>
                                    <tr>
                                        <th>id</th>
                                        <th>username</th>
                                        <th>email</th>
                                        <th>role</th>
                                        <th>salt (128-bit)</th>
                                        <th>password_hash</th>
                                        <th>otp</th>
                                    </tr>
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    `;
                });
            } else if (tab === 'crypto') {
                body.innerHTML = `
                    <h4 style="margin-bottom:8px; color:#1e293b;">Interactive Salt + Pepper Pipeline Visualizer</h4>
                    <p style="color:#64748b; font-size:0.85rem; margin-bottom:14px;">
                        Type a password below to watch the live cryptographic transformation through User Salt and Server Pepper:
                    </p>
                    <div class="form-group">
                        <label for="testPwdInput">Test Password</label>
                        <input type="text" id="testPwdInput" class="form-control" value="MySecretPass@2026" oninput="updateCryptoVisualizer()">
                    </div>
                    <div id="cryptoVisualizerOutput"></div>
                `;
                updateCryptoVisualizer();
            }
        }

        async function updateCryptoVisualizer() {
            const input = document.getElementById('testPwdInput');
            if (!input) return;
            const pwd = input.value || '';
            const sampleSalt = generateSalt();
            const { hmacHex, finalHash } = await hashPasswordWithSaltAndPepper(pwd, sampleSalt);

            const out = document.getElementById('cryptoVisualizerOutput');
            out.innerHTML = `
                <div class="code-box">
<span style="color:#38bdf8;">1. Input Password:</span> "${escapeHtml(pwd)}"
<span style="color:#38bdf8;">2. Generated 128-Bit Salt:</span> ${sampleSalt}
<span style="color:#38bdf8;">3. Server-Side Secret Pepper:</span> "${SERVER_PEPPER}" (Kept outside database)
<span style="color:#f59e0b;">4. Keyed HMAC-SHA256 Digest:</span>
   ${hmacHex}
<span style="color:#10b981;">5. Final Stored Hash (Saved in Database):</span>
   ${finalHash}
                </div>
                <div class="alert alert-info" style="font-size:0.82rem; margin-top:10px;">
                    <strong>Academic Defense Insight:</strong> Even if two users share the same password, their unique salts produce completely distinct stored hashes, defeating rainbow tables. If the database is leaked, attackers cannot crack passwords without the server pepper.
                </div>
            `;
        }

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, m => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[m]);
        }

        // Initialize app on load
        window.addEventListener('DOMContentLoaded', async () => {
            await getDatabase();
            const session = getSession();
            if (session && session.logged_in) {
                navigateTo(session.role === 'admin' ? 'admin_dashboard' : 'user_dashboard');
            } else {
                navigateTo('login');
            }
        });
    </script>
</body>
</html>
